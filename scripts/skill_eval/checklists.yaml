# skill 要否テストの採点表。reference の「必ず出す図」「必ず出す値」を 1 項目ずつ、出たか出ないかで採点する。
# キーは reference のファイル名（拡張子なし）。採点表のある reference を期待するケースだけが採点される。
#
# 見つけ方は正規表現（大文字・小文字は区別しない）で書く。
#   code        生成されたスクリプトに、どれか 1 つが現れる
#   code_all    生成されたスクリプトに、すべてが現れる
#   report      最終応答・生成された .md・小さな .csv の文に、どれか 1 つが現れる（否定の文は数えない）
#   report_all  同じく、すべてが現れる
# 複数のグループを書いた項目は、どれか 1 つを満たせば「出た」。図の項目は、図のファイルが作られていることも条件。
#
# 値の項目は「診断として報告された」ときに出たと数える。回帰の表に SE の列があるだけ、のような
# 素材の出力は数えないよう、診断の名前（VIF・EPV・完全分離 など）で探す。
# 条件つきの項目（確率を使う場合のキャリブレーション図など）と、その手法に当たらない行は入れていない。

glm: # 二値の目的変数
  items:
    - {id: fig-roc, kind: 図, label: ROC 曲線, code: ['roc_curve\(', 'RocCurveDisplay']}
    - {id: fig-pr, kind: 図, label: PR 曲線, code: ['precision_recall_curve\(', 'PrecisionRecallDisplay']}
    - {id: fig-calibration, kind: 図, label: キャリブレーションプロット, code: ['calibration_curve\(', 'CalibrationDisplay']}
    - {id: fig-binned-residual, kind: 図, label: binned residual plot, code: ['binned', 'bin\w*.{0,20}resid', 'resid\w*.{0,20}bin']}
    - {id: val-se, kind: 値, label: 係数の SE（完全分離の確認）, report: ['完全分離', 'SE.{0,6}(最大|max)', 'SE_max']}
    - {id: val-vif, kind: 値, label: VIF の最大値, report: ['VIF']}
    - {id: val-repeated, kind: 値, label: 反復測定・パネル構造, report: ['反復測定', 'パネル構造', 'cluster.?robust', 'クラスタ.?ロバスト']}
    - {id: val-abs-coef, kind: 値, label: 係数の絶対値, report: ['\\?\|係数\\?\|', '係数の絶対値', 'abs_coef']}
    - {id: val-epv, kind: 値, label: EPV, report: ['EPV']}
    - {id: val-auc-ap, kind: 値, label: AUC・AP, report_all: ['AUC', '\bAP\b|average.precision|平均適合率']}
    - {id: val-brier, kind: 値, label: Brier score, report: ['Brier']}
    - {id: val-binned-out, kind: 値, label: binned residual のバンド外ビン数, report: ['帯外', 'バンド外', 'binned_out']}

# 残差 4 点セットは、パネルごとに合格の読み方が違うので 4 項目に分けた。残差の正規性は Shapiro-Wilk 以外の
# 検定（Jarque-Bera など）で報告したものも数える
ols: # OLS（順序のない横断データ、n < 5000）。Durbin-Watson（行に順序があるときだけ）と、正則化・分位点回帰の行は入れていない
  items:
    - {id: fig-resid-fitted, kind: 図, label: 残差 vs 予測値, code: ['residplot\(', '(scatter|plot|regplot)\([^)\n]{0,80}(fitted|y_?hat|pred)\w*\s*,[^)\n]{0,80}resid', 'set_title\([^)\n]{0,60}(残差\s*(vs\.?|対|と)\s*(予測|fitted|当てはめ)|resid\w*\s*vs\.?\s*fitted)']}
    - {id: fig-qq, kind: 図, label: Q-Q プロット, code: ['probplot\(', 'qqplot\(', 'ProbPlot\(']}
    - {id: fig-scale-location, kind: 図, label: Scale-Location（√|標準化残差| vs 予測値）, code: ['sqrt\(\s*(np\.)?abs\(', 'scale.?location']}
    # てこ比を自前で計算して描いたもの（scatter(r.leverage, std_resid)）も数える。HC3 の計算にだけ使った leverage は数えない
    - {id: fig-leverage, kind: 図, label: レバレッジ vs 標準化残差（点サイズ = Cook's D）, code: ['hat_matrix_diag', 'influence_plot\(', 'plot_leverage_resid2\(', 'scatter\([^)\n]{0,40}(leverage|\bh_?ii\b)', 'set_title\([^)\n]{0,60}(てこ比|レバレッジ|leverage)']}
    - {id: val-bp, kind: 値, label: Breusch-Pagan p, report: ['Breusch', 'ブルーシュ', '\bBP\s*(検定|p|の)', '\bWhite\b.{0,8}(検定|test)', '(不均一|等)分散.{0,12}(検定|p\s*[=＝<>値])']}
    - {id: val-vif, kind: 値, label: VIF の最大値, report: ['VIF', '分散拡大']}
    - {id: val-cooks, kind: 値, label: Cook's D > 4/n の件数, report: ['Cook', 'クック', '4\s*/\s*n']}
    - {id: val-shapiro, kind: 値, label: 残差の正規性の検定（Shapiro-Wilk p）, report: ['Shapiro', 'シャピロ', 'Jarque', 'ジャック.?ベラ', 'Omnibus', 'オムニバス', 'Anderson', '正規性.{0,12}(検定|p\s*[=＝<>値])']}

# 線形モデル向けの図（群別軌跡、条件付き残差の残差 vs 予測値・Q-Q）と REML / ML の行は、二値の目的変数には当たらないので
# 入れていない。二値の当てはまりは glm の採点表で数える
mixed-effects: # 二値の目的変数のランダム切片モデル（チケット = 群）。固定効果（PanelOLS）の行は入れていない
  items:
    - {id: fig-forest, kind: 図, label: 係数と 95% CI のフォレストプロット, code: ['forest', 'フォレスト', 'errorbar\([^\n]{0,200}(coef|odds|\bor\b|オッズ|params|xerr)', 'hlines\([^\n]{0,200}(ci|conf|lower|lo\b)']}
    # 残差の Q-Q と取り違えないよう、Q-Q に渡すものかタイトルにランダム効果が現れるものだけ数える
    - {id: fig-blup-qq, kind: 図, label: ランダム効果（BLUP）の Q-Q, code: ['(probplot|qqplot|ProbPlot)\([^)\n]{0,60}(random_eff|blup|ranef|conditional_mode|\b[bu]_hat|\bre_\w*|\bre\b|_re\b|mode)', 'set_title\([^)]{0,80}(ランダム効果|ランダム切片|BLUP|random.?effect)[^)]{0,40}(Q-?Q|分位)', 'set_title\([^)]{0,80}Q-?Q[^)]{0,40}(ランダム効果|ランダム切片|BLUP|random.?effect)']}
    - {id: val-n-groups, kind: 値, label: 群数, report: ['(群|グループ|チケット)(の)?数[^。\n]{0,10}\d', '\d[\d,]*\s*(群|グループ|個のチケット|種類のチケット|チケット)', 'n_groups']}
    - {id: val-obs-per-group, kind: 値, label: 群あたりの観測数（1 件のみの群の割合）, report: ['(1\s*人|1\s*件|1\s*名|一人|単独)(だけ)?の(群|グループ|チケット)', '(群|グループ|チケット)(あたり|ごと)の(人数|観測数|件数|サイズ)', 'singleton']}
    - {id: val-coef-vs-pooled, kind: 値, label: 係数 + 95% CI を群構造を無視したモデルと並置, report: ['(群|グループ)(構造)?を無視', '(通常|普通|単純|プール)(の|した)?ロジスティック', 'pooled']}
    - {id: val-fe-re, kind: 値, label: 固定効果と変量効果のどちらを選んだかと理由, report: ['固定効果[^。\n]{0,60}(変量|ランダム)効果', '(変量|ランダム)効果[^。\n]{0,60}固定効果', 'Mundlak', 'Hausman', 'ハウスマン']}
    - {id: val-icc, kind: 値, label: ICC, report: ['ICC', '級内相関', 'グループ内相関', '群内相関']}
    - {id: val-converged, kind: 値, label: 収束フラグ, report: ['収束', 'converge'], allow_negation: true}
    - {id: val-re-var-min, kind: 値, label: ランダム効果の分散（0 近傍に張り付いていないか）, report: ['(ランダム|変量)(切片|効果)の?(分散|SD|標準偏差)', 'σ\s*[=＝]?\s*\d', 'singular', '特異']}
    - {id: val-df-approx, kind: 値, label: 係数の自由度近似の限界, report: ['自由度', 'Wald', 'ワルド', '近似[^。\n]{0,20}(CI|信頼区間|p\s*値)']}

# 連続量の 2 群比較（ユーザーが t 検定を名指しした場合）。比率・分割表・対応あり・多重比較・ANOVA の行は入れていない。
# 「p 値は 1 つだけ」は出たかでは数えられないので、p 値が出たかだけを数え、事前検定や追加の検定の有無は目で見る
hypothesis-test:
  items:
    - {id: fig-dist, kind: 図, label: 群別の分布（箱ひげ + 個票）, code_all: ['boxplot\(|violinplot\(', 'stripplot\(|swarmplot\(|scatter\(|jitter']}
    - {id: val-diff-ci, kind: 値, label: 差の点推定 + 95% CI, report: ['差[^。\n]{0,40}(95\s*[%％]|信頼区間|\bCI\b)', '(95\s*[%％]|信頼区間|\bCI\b)[^。\n]{0,30}差']}
    - {id: val-effsize, kind: 値, label: 効果量（Cohen's d）, report: ['Cohen', 'コーエン', 'Hedges', '効果量']}
    - {id: val-desc, kind: 値, label: 群ごとの n と記述統計, report_all: ['\bSD\b|標準偏差', '中央値|四分位|IQR']}
    - {id: val-tested, kind: 値, label: 検定の位置づけ（事前仮説か、指示で行ったか）, report: ['事前(の)?仮説', '(指示|依頼|ご要望)(どおり|通り|に(従|沿|基づ)|を受け|があった|された)[^。\n]{0,30}検定', '検定[^。\n]{0,30}(指示|依頼)(どおり|通り|で|により)', '探索(的)?(な|で|であ)']}
    - {id: val-p, kind: 値, label: p 値, report: ['\bp\s*[=＝<>≈]', 'p\s*値', 'p-value']}
    - {id: val-welch, kind: 値, label: 等分散の扱い（最初から Welch）, report: ['Welch', 'ウェルチ', '等分散を(仮定|前提)(し|と)(ない|せず)'], allow_negation: true}

survival: # KM + Cox（カテゴリ共変量あり）。ログランク・AFT・RMST・競合リスクの行は入れていない
  items:
    - {id: fig-km, kind: 図, label: KM 曲線, code: ['KaplanMeierFitter\(', 'kaplan_meier_estimator\(']}
    - {id: fig-km-censor, kind: 図, label: KM 曲線の打ち切りマーク, code: ['show_censors\s*=\s*True', 'censor_styles']}
    - {id: fig-km-atrisk, kind: 図, label: KM 曲線の at-risk テーブル, code: ['add_at_risk_counts\(', 'at_risk_counts\s*=\s*True']}
    - {id: fig-schoenfeld, kind: 図, label: Schoenfeld 残差プロット, code: ['check_assumptions\(', 'compute_residuals\([^)]*schoenfeld', 'schoenfeld.{0,200}(scatter|plot)\(']}
    - {id: fig-forest, kind: 図, label: HR と 95% CI のフォレストプロット, code: ['forest', 'フォレスト', 'cph\.plot\(', 'hazard_ratios?.{0,40}\.png']}
    - {id: fig-loglog, kind: 図, label: カテゴリ共変量の log(-log(S(t))) プロット, code: ['plot_loglogs\(', 'log\(\s*-\s*np\.log\(', 'loglog']}
    - {id: val-censoring, kind: 値, label: 打ち切りの割合・追跡期間の中央値・イベント数, report_all: ['打ち切り', '追跡(期間)?(の)?中央値|追跡期間.{0,12}中央値|中央値.{0,12}追跡']}
    - {id: val-schoenfeld-p, kind: 値, label: Schoenfeld 検定 p, report: ['Schoenfeld', 'シェーンフェルド', '比例ハザード.{0,24}(検定|p\s*[=＝<>])']}
    - {id: val-cindex-cv, kind: 値, label: C-index（学習データ外）, code_all: ['concordance', 'k_fold_cross_validation\(|KFold\(|cross_val|train_test_split\(']}
    - {id: val-hr-ci, kind: 値, label: HR + 95% CI, report_all: ['HR|ハザード比', '95\s*[%％]|信頼区間|\bCI\b']}
    - {id: val-epv, kind: 値, label: イベント数 / 共変量数, report: ['EPV', 'イベント(数)?\s*(/|÷|／)\s*(共変量|変数)', '(共変量|変数)\s*1\s*つ?(あ|当)たり', 'イベント.{0,16}(共変量|変数).{0,8}(あ|当)たり']}

# 「差分」は「残差分布」にも当たるので、直前が「残」のものは数えない。カバレッジは、測った値ではなく
# 「被覆率は名目より低い可能性がある」という注意書きだけの文を数えない
time-series: # モデルを当てはめて予測する場合。ARIMA・VAR・変化点に固有の行（ADF / KPSS、次数の根拠など）は入れていない
  items:
    - {id: fig-diff, kind: 図, label: 差分後の系列, code: ['set_title\([^\n]{0,80}(?<!残)差分', 'label\s*=[^\n]{0,60}(?<!残)差分']}
    - {id: fig-pacf, kind: 図, label: コレログラム（ACF / PACF）, code: ['plot_pacf\(', '\bpacf\(']}
    - {id: fig-decomp, kind: 図, label: トレンド・季節・残差への分解（STL など）, code: ['STL\(', 'seasonal_decompose\(', 'set_title\([^\n]{0,80}分解']}
    - {id: fig-resid, kind: 図, label: 残差の診断, code: ['plot_diagnostics\('], code_all: ['resid', 'plot_acf\(']}
    - {id: fig-band, kind: 図, label: 予測区間の帯, code: ['fill_between\(']}
    - {id: fig-origin, kind: 図, label: 予測の起点の縦線, code: ['axvline\(', 'axvspan\(']}
    - {id: fig-naive, kind: 図, label: 季節 naive の予測を同じ軸に重ねる, code: ['label\s*=\s*f?.[^\n]{0,40}(naive|ナイーブ)']}
    - {id: val-missing-periods, kind: 値, label: 欠測している期の数, report: ['(欠測|欠損).{0,20}\d', '\d\s*(週|行|件|か月|ヶ月).{0,10}(欠測|欠損)', '(空|抜け)[^。\n]{0,8}(週|期|月)\s*\d']}
    - {id: val-dup, kind: 値, label: 同じ時点の重複行数, report: ['重複']}
    - {id: val-tail, kind: 値, label: 末尾の期が完結しているか, report: ['完結', '(末尾|最終|最後)(の)?(期|週|月).{0,30}(そろ|揃|未完|除外|確定)']}
    - {id: val-period, kind: 値, label: 季節周期, report: ['周期']}
    - {id: val-ljungbox, kind: 値, label: 残差の Ljung-Box p, report: ['Ljung']}
    - {id: val-split, kind: 値, label: 分割方法（時間順の検証）, report: ['ホールドアウト', 'ローリング', 'バックテスト', '時間順', '起点']}
    - {id: val-horizon, kind: 値, label: 予測の地平 h での評価, report: ['(104\s*週|2\s*年|24\s*(か|ヶ|ケ)月)先', '(104\s*週|2\s*年|24\s*(か|ヶ|ケ)月).{0,24}検証', '検証.{0,40}(104\s*週|2\s*年|24\s*(か|ヶ|ケ)月)']}
    - {id: val-naive, kind: 値, label: ベースライン（季節 naive）との比較, report: ['naive', 'ナイーブ']}
    - {id: val-mase, kind: 値, label: MASE, report: ['MASE']}
    - {id: val-coverage, kind: 値, label: 予測区間の実測カバレッジ, report: ['(カバレッジ|被覆率)(?!.{0,30}(可能性|かもしれ))', '(区間|帯)(の中)?に(入|収ま)']}

# val-pipeline と val-score-vs-baseline は、skill なしでも毎回出たので reference から行を削った。
# 削ったあとも出ているかを見るために、採点表には残している
ml-evaluation: # 分類
  items:
    - {id: fig-learning-curve, kind: 図, label: 過学習を見る曲線（学習曲線）, code: ['learning_curve\(', 'LearningCurveDisplay', 'staged_predict', 'evals_result', 'record_evaluation\(', 'train_score_', 'validation_score_', 'plot_metric\(']}
    # Dummy は、陽性率を一律に予測する定数（np.full(n, y.mean())）を自前で作ったものも数える
    - {id: fig-baseline, kind: 図, label: ベースラインとの比較（幅つき）, code_all: ['Dummy(Classifier|Regressor)|np\.full\([^\n]{0,80}(\.mean\(|prior|base_rate)', 'boxplot\(|violinplot\(|errorbar\(']}
    - {id: fig-confusion, kind: 図, label: 混同行列, code: ['confusion_matrix\(', 'ConfusionMatrixDisplay']}
    - {id: fig-roc-pr, kind: 図, label: PR 曲線・ROC 曲線, code_all: ['roc_curve\(|RocCurveDisplay', 'precision_recall_curve\(|PrecisionRecallDisplay']}
    - {id: val-pipeline, kind: 値, label: 前処理が Pipeline の中にあるか, code: ['Pipeline\(', 'make_pipeline\('], report: ['前処理.{0,14}(リーク|Pipeline|パイプライン)', '学習する前処理(は)?(なし|無し|ない)']}
    - {id: val-split, kind: 値, label: 分割方法, code: ['stratify\s*=', 'Stratified\w*KFold', 'GroupKFold', 'TimeSeriesSplit']}
    - {id: val-score-vs-baseline, kind: 値, label: 汎化スコアと幅（ベースラインとの比較）, code_all: ['Dummy(Classifier|Regressor)|np\.full\([^\n]{0,80}(\.mean\(|prior|base_rate)', 'cross_val|KFold|bootstrap|resample']}
    # 「学習データでの交差検証 AUC は 0.886 で、テストとの差があります」は検証どうしの比較なので数えない
    - {id: val-train-val-gap, kind: 値, label: train と validation のスコアの差, report: ['(train|学習(用)?データ|訓練)(?!(での?|の|における|内の?|内で)\s*(\d+\s*-?\s*(fold|分割)\s*)?(交差検証|CV|クロスバリデーション)).{0,30}((?<!交)差|ギャップ|gap)', '((?<!交)差|ギャップ).{0,12}train', 'train_val_gap', '学習\s*(と|・|／|/)\s*(検証|valid|テスト|test)(データ)?\s*(の|間の)?\s*(差|ギャップ)', '学習\s*(AUC|スコア|正解率|精度|損失|log.?loss|accuracy)\s*[\d.]+.{0,20}(検証|valid|テスト|test)']}
    - {id: val-test-once, kind: 値, label: テストデータでの評価回数, report: ['(テスト|test|ホールドアウト|最終評価|最後の確認|評価用|検証データ).{0,30}(1\s*回|一度)', '(1\s*回|一度)(だけ|のみ).{0,12}(評価|テスト)']}
    - {id: val-tuning-split, kind: 値, label: チューニング時の分割, report: ['チューニング', 'ハイパーパラメータ', 'nested'], allow_negation: true}
    - {id: val-base-rate, kind: 値, label: 陽性率, report: ['陽性率', '生存率.{0,24}\d', 'クラスの偏り']}
    - {id: val-mean-pred, kind: 値, label: 平均予測確率 ÷ 実際の陽性率, report: ['平均予測確率', '予測確率の平均', 'mean_pred']}

# 欠測機構の見立ては「ランダムな欠損ではない」「欠損していない人より低い」のように否定の形で
# 書かれるので、否定の文も数える。MCAR などの用語を使わず平易に書いた報告も拾う
missing-data: # 欠測の代入（欠測のある列が 2 つ以上）。外れ値・EDA の行は入れていない
  items:
    - {id: fig-matrix, kind: 図, label: 欠測マトリクス, code: ['msno\.matrix\('], code_all: ['is_null\(|isnull\(|isna\(', 'imshow\(|pcolormesh\(|matshow\(|heatmap\(']}
    - {id: fig-heatmap, kind: 図, label: 欠測相関ヒートマップ, code: ['msno\.heatmap\('], code_all: ['is_null\(|isnull\(|isna\(', '\.corr\(|corrcoef\(', 'imshow\(|pcolormesh\(|matshow\(|heatmap\(']}
    - {id: fig-imputed-dist, kind: 図, label: 観測値 vs 代入値の分布比較, code_all: ['hist\(|histplot\(|kdeplot\(|kde\(', 'imput|代入|補完']}
    - {id: val-miss-rate, kind: 値, label: 変数別欠測率, report: ['(欠測|欠損)率', '(欠測|欠損).{0,16}\d+(\.\d+)?\s*[%％]', '\d[\d,]*\s*件\s*[（(]\s*\d+(\.\d+)?\s*[%％]']}
    - {id: val-mechanism, kind: 値, label: 欠測機構の見立て, report: ['MCAR', '\bMAR\b', 'MNAR', '(欠測|欠損)(の)?(機構|メカニズム)', 'ランダム(な|に)', '偶然の(欠損|欠測)', '(欠損|欠測|欠けて).{0,24}(自体|そのもの)に(情報|意味)', '他の列(で|から)説明'], allow_negation: true}
    - {id: val-method-n, kind: 値, label: 採用した処理と失う n, report: ['リストワイズ', '多重代入', 'MICE', '(中央値|最頻値|平均値|回帰|モデル).{0,16}(代入|補完|埋め)', '(代入|補完|埋め).{0,16}(中央値|最頻値|平均値)']}
    - {id: val-oplog, kind: 値, label: 除外・変換・代入の操作ログ（件数付き）, report: ['\d[\d,]*\s*(件|行|人|個).{0,80}(代入|補完|埋め|除[外いきく]|削除|置き換え)', '(代入|補完|埋め|除[外いきく]|削除).{0,24}\d[\d,]*\s*(件|行|人|個)', '\d[\d,]*\s*[（(]\s*\d+(\.\d+)?\s*[%％]\s*[）)].{0,80}(代入|補完|埋め|置き換え)']}

dimensionality-reduction: # PCA（数値列の要約）。EFA・CFA・UMAP / t-SNE の行は入れていない
  items:
    - {id: fig-scree, kind: 図, label: スクリープロット, code: ['scree', 'スクリー', '(\.plot|\.bar|\.step)\([^)]{0,200}explained_variance']}
    - {id: fig-parallel, kind: 図, label: スクリープロットに重ねた平行分析のランダム固有値, code: ['parallel.?analysis', '平行分析', '\bhorn\b']}
    - {id: fig-biplot, kind: 図, label: バイプロット（スコアの散布 + 負荷ベクトル）, code: ['biplot', 'バイプロット', 'quiver\(', '\.arrow\(', 'arrowprops']}
    - {id: val-parallel, kind: 値, label: 成分数の根拠（平行分析）, report: ['平行分析', 'parallel.?analysis']}
    - {id: val-cumvar, kind: 値, label: 累積寄与率, report: ['累積寄与', '累積(説明)?分散', '累積.{0,6}(寄与|説明)', 'cumulative', '寄与率\s*[（(]\s*累積', '(つ|成分|PC\s*\d|第\s*\d\s*主成分)\s*(だけ)?で.{0,16}\d+(\.\d+)?\s*[%％]']}
    - {id: val-standardize, kind: 値, label: 標準化の有無（相関行列か共分散行列か）, report: ['標準化', '相関行列', '共分散行列', 'StandardScaler', 'standardi[sz]', 'z.?スコア'], allow_negation: true}

# 「表か図」でよい項目（上位 k 件の表、ベースラインとの重なり、設定間の Jaccard）は値の側で数える。
# 設定間の一致は「設定を変えたときの上位 20 人の重なり」のような言い方も数える
anomaly-detection: # IsolationForest（ラベルなし、時系列でない）。PR 曲線（ラベルあり）と時系列の行は入れていない
  items:
    - {id: fig-score-hist, kind: 図, label: 異常スコアのヒスト（閾値に縦破線）, code: ['(hist|histplot)\([^)\n]{0,80}score', 'score\w*[^\n]{0,40}\.hist\(']}
    # 特徴ごとのパーセンタイルで行ごとに説明したものも、z スコアと同じ目的なので数える
    - {id: val-topk-z, kind: 値, label: 上位 k 件の説明（各特徴の z スコア）, report: ['z\s*スコア', 'z-?score', '\bz_\w+', '\bz\s*[=＝]\s*[-+−]?\d', '(各特徴(量)?の|特徴(量)?ごとの)\s*パーセンタイル', '\b[a-z]+_pct\b']}
    - {id: val-baseline, kind: 値, label: 単純ベースライン（z スコア / IQR / Mahalanobis）との比較, report: ['(z\s*スコア|z-?score|IQR|Mahalanobis|マハラノビス)[^。\n]{0,60}(重な|一致|共通|Jaccard|ジャッカード|比較|ベースライン)', '(ベースライン|単純(な)?(方法|手法))[^。\n]{0,60}(重な|一致|共通|Jaccard|ジャッカード)', '(重な|一致|共通|うち\s*\d+\s*(人|件))[^。\n]{0,80}(IQR|z\s*スコア|Mahalanobis|マハラノビス)']}
    - {id: val-contamination, kind: 値, label: 検知件数（contamination）の根拠, report: ['(contamination|検知(件数|率)|異常(の)?(件数|割合)|上位\s*\d+\s*(件|人))[^。\n]{0,40}(根拠|理由|業務|確認(でき|能力|件数)|目安)', '(根拠|理由)[^。\n]{0,20}(contamination|検知(件数|率))', '\d+\s*[%％][^。\n]{0,10}(特別な)?根拠', '慣例(的|として)', '仮置き', '仮に(置|決)', '(業務上の|特別な)(基準|根拠)(が|は)(ない|無い|なく|ありません)'], allow_negation: true}
    # 「閾値は上位 5%」のように件数を言い換えただけのものは数えない。分布の切れ目を確かめた文は数える
    - {id: val-threshold, kind: 値, label: 閾値の根拠, report: ['(閾値|しきい値|カットオフ)[^。\n]{0,40}(根拠|切れ目|業務|件数|分布|決め)', '(分布|スコア|裾)[^。\n]{0,40}切れ目']}
    - {id: val-jaccard, kind: 値, label: seed・ハイパラ間の上位 k 件の Jaccard, report: ['(seed|シード|max_samples|n_estimators|ハイパラ|設定)[^。\n]{0,60}(Jaccard|ジャッカード|一致)', '(Jaccard|ジャッカード)[^。\n]{0,60}(seed|シード|max_samples|設定|ハイパラ)', '(seed|シード|設定)[^。\n]{0,30}(変え|振)[^。\n]{0,40}重な']}
    - {id: val-scaling, kind: 値, label: スケーリングの方針, report: ['標準化', 'スケーリング', 'RobustScaler', 'StandardScaler', '(線形|単調)変換に(ほぼ)?不変', '対数(変換|化)'], allow_negation: true}

tree-model: # GBDT（SHAP のケースで採点）。単一木・RF に固有の行（dtreeviz・枝刈り・OOB・最小葉）は入れていない
  items:
    - {id: fig-gbdt-curve, kind: 図, label: train / valid loss vs iteration, code: ['evals_result', 'record_evaluation\(', 'staged_(predict|decision)', 'train_score_', 'validation_score_', 'plot_metric\(']}
    - {id: fig-pi, kind: 図, label: permutation importance の棒 + エラーバー, code_all: ['permutation_importance\(', 'xerr|yerr|errorbar\(|importances_std|boxplot\(']}
    - {id: val-train-valid, kind: 値, label: train / valid スコア, report: ['(train|学習(用)?データ|訓練)(?!(での?|の|における|内の?|内で)\s*(\d+\s*-?\s*(fold|分割)\s*)?(交差検証|CV|クロスバリデーション)).{0,30}((?<!交)差|ギャップ|gap)', '((?<!交)差|ギャップ).{0,12}train', 'train_val_gap', '学習\s*(と|・|／|/)\s*(検証|valid|テスト|test)(データ)?\s*(の|間の)?\s*(差|ギャップ)', '学習\s*(AUC|スコア|正解率|精度|損失|log.?loss|accuracy)\s*[\d.]+.{0,20}(検証|valid|テスト|test)']}
    - {id: val-best-iter, kind: 値, label: best_iteration と learning_rate, report_all: ['best.?iter|最良(の)?(反復|イテレーション|ラウンド)|最適(な)?(反復|イテレーション|ラウンド|木の(本)?数)|早期停止|early.?stopping|n_iter_|(止まった|停止した)(反復|ラウンド)|本数.{0,40}(最小|最良)(に|と)?(なる|だった|の)|\d+\s*(本|回|ラウンド|反復)(目)?で(止ま|停止|打ち切)', 'learning.?rate|学習率']}
    - {id: val-min-leaf, kind: 値, label: 葉サイズの下限設定, report: ['min_child_samples', 'min_samples_leaf', 'min_data_in_leaf', 'min_child_weight', '葉.{0,8}(最小|下限)', '(最小|下限).{0,8}葉'], allow_negation: true}
    # 「運賃だけを入れ替える重要度テスト」「SHAP と入れ替えテストの順位一致」のように、入れ替えと言い換えたものも数える
    - {id: val-pi-top, kind: 値, label: permutation importance の上位, report: ['permutation', '(並べ替え|置換|順列|シャッフル)(による|の)?(特徴量)?重要度', '入れ替え(る|た|による|の)?.{0,10}(重要度|テスト)']}
    - {id: val-seed-sd, kind: 値, label: seed 3〜5 本のスコア SD, report: ['(seed|シード).{0,40}(SD|標準偏差|ばらつき|±|幅)', '(SD|標準偏差|ばらつき|±).{0,40}(seed|シード)']}
    # 「S/C/Q を 0/1/2 に順序コード化」「C/Q/S をカテゴリ特徴として使用」も数える
    - {id: val-cat-encoding, kind: 値, label: カテゴリ変数の入れ方, report: ['one.?hot', 'ワンホット', 'ダミー(変数|化|列)', '(の|を)\s*ダミー(?!\s*(分類|モデル|予測|ベースライン))', 'categorical_feature', 'カテゴリ(変数|型|特徴量?)?として', '\d(\s*/\s*\d)+\s*(に|へ)\s*(順序)?(コード|符号|変換|置き換え|エンコード)', '順序(コード|エンコード|符号)', '(ネイティブ|native).{0,6}(カテゴリ|categor)', 'target.?encod', 'ターゲット.?エンコ', 'label.?encod', 'ラベル.?エンコ', '(0\s*/\s*1|0・1|二値|数値|整数)(に|へ)(変換|符号化|置き換え|エンコード)', '整数(の)?(番号|コード|値)', '(女性|男性|female|male)\s*[=＝]\s*1'], allow_negation: true}

model-interpretation: # SHAP（木系）。permutation importance の図は tree-model の側で採点する。PDP / ICE・ALE・代理モデルの行と、条件つきの行（図に描いた特徴数、手法間の順位一致）は入れていない
  items:
    # 混同行列のヒートマップと、特徴量と SHAP 値の相関（corrcoef）が同じスクリプトにあるだけで当たらないよう、
    # ヒートマップに渡すものが相関行列であることを見る
    - {id: fig-corr, kind: 図, label: 特徴量間相関ヒートマップ, code: ['(heatmap|imshow|matshow|pcolormesh|clustermap)\([^)]{0,60}corr']}
    - {id: fig-beeswarm, kind: 図, label: SHAP summary（beeswarm）, code: ['beeswarm', 'summary_plot\(']}
    - {id: fig-shap-bar, kind: 図, label: SHAP bar, code: ['plots\.bar\(', 'plot_type\s*=\s*.bar', 'shap.{0,120}\.barh?\(', '\.barh?\([\s\S]{0,100}?(mean_?abs|abs_?shap|shap_?val|shap_?imp)']}
    - {id: val-not-causal, kind: 値, label: 「解釈 ≠ 因果」の 1 文, report: ['因果', 'causal'], allow_negation: true}
    - {id: val-corr-pairs, kind: 値, label: '相関 |r| > 0.8 のペア', report: ['\|\s*r\s*\|\s*[>＞≥]', '相関.{0,24}0\.8', '0\.8.{0,24}相関', '多重共線', '(強い|高い)相関', '相関(が|の)(強|高)', '(互いに|同士で?)相関', '相関(した|している)(特徴|変数)', '(ほぼ|大部分が?)同じ情報', '(寄与|重要度).{0,12}(分け合|分散して|分散する|分散し、|割れ)'], allow_negation: true}
    - {id: val-rank-stability, kind: 値, label: 重要度順位の安定性（fold 間の Spearman ρ）, report: ['(fold|フォールド|分割)\s*(間|ごと).{0,40}(spearman|スピアマン|ρ|順位)', '(spearman|スピアマン|ρ|順位相関).{0,40}(fold|フォールド|分割)', '(各|それぞれの)\s*(fold|フォールド|分割).{0,40}順位', '順位.{0,16}安定', 'rank.?stab']}
    # 「base value は −0.603」のように基準値を書いただけの報告は、検算ではないので数えない
    - {id: val-additivity, kind: 値, label: SHAP の加法性の検算, report: ['加法性', 'additiv', '(base.?value|基準値|期待値)\s*[+＋]', '(SHAP|shap)\s*(値)?\s*の\s*(合計|和|総和)', 'Σ\s*SHAP']}

clustering: # k-means
  items:
    - {id: fig-silhouette-plot, kind: 図, label: シルエットプロット（サンプル別）, code: ['silhouette_samples\(']}
    - {id: fig-pca, kind: 図, label: PCA 2 次元射影, code: ['PCA\(']}
    - {id: fig-profile, kind: 図, label: クラスタプロファイル, code: ['heatmap\(', 'imshow\(', 'pcolormesh\(']}
    - {id: fig-external, kind: 図, label: 外部変数プロファイル, report: ['外部変数', '(クラスタ|セグメント|分割|分類|分け).{0,24}使(って|わ)(い)?(ません|ない|なかった|ず)', '未使用']}
    - {id: fig-k-scan, kind: 図, label: エルボーとシルエット平均の k 走査, code_all: ['inertia_', 'silhouette_score\(']}
    - {id: fig-null-band, kind: 図, label: 走査図の帰無ベースライン, code: ['permutation\(', 'permuted', 'shuffle\(']}
    - {id: val-scaling, kind: 値, label: スケーリングの方針, report: ['標準化', 'スケーリング', 'log1p', '対数変換']}
    - {id: val-k-rationale, kind: 値, label: 採用した k とその根拠, report: ['k\s*[=＝]\s*\d+.{0,60}(採用|選)', '(採用|選).{0,60}k\s*[=＝]\s*\d+', 'k\s*[=＝]\s*\d+.{0,14}(にした|とした|に決め)', 'k\s*[=＝]\s*\d+.{0,20}(最大|最良|最も高)', 'k の(根拠|決め方|選び方)']}
    - {id: val-null, kind: 値, label: 帰無ベースラインとの比較, report: ['帰無'], code: ['permutation\(']}
    - {id: val-silhouette-mean, kind: 値, label: シルエット平均, report: ['(シルエット|silhouette).{0,24}\d\.\d']}
    - {id: val-cluster-n, kind: 値, label: 各クラスタの n, report: ['人数', '\(?n\s*[=＝]\s*\d+', '最小クラスタ']}
    - {id: val-stability, kind: 値, label: 安定性（ARI）, code: ['adjusted_rand_score\('], report: ['ARI.{0,30}\d\.\d']}
    - {id: val-seed, kind: 値, label: n_init と乱数 seed, report: ['n_init', 'seed\s*[=＝]\s*\d+', '(乱数|シード).{0,12}\d+']}
