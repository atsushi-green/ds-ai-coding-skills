# skill 要否テストの採点表。reference の「必ず出す図」「必ず出す値」を 1 項目ずつ、出たか出ないかで採点する。
# キーは reference のファイル名（拡張子なし）。採点表のある reference を期待するケースだけが採点される。
#
# 見つけ方は正規表現（大文字・小文字は区別しない）で書く。
#   code        生成されたスクリプトに、どれか 1 つが現れる
#   code_all    生成されたスクリプトに、すべてが現れる
#   report      最終応答・生成された .md・小さな .csv の文に、どれか 1 つが現れる（否定の文は数えない）
#   report_all  同じく、すべてが現れる
# 複数のグループを書いた項目は、どれか 1 つを満たせば「出た」。図の項目は、図のファイルが作られていることも条件。
#
# 値の項目は「診断として報告された」ときに出たと数える。回帰の表に SE の列があるだけ、のような
# 素材の出力は数えないよう、診断の名前（VIF・EPV・完全分離 など）で探す。
# 条件つきの項目（確率を使う場合のキャリブレーション図など）と、その手法に当たらない行は入れていない。

glm: # 二値の目的変数
  items:
    - {id: fig-roc, kind: 図, label: ROC 曲線, code: ['roc_curve\(', 'RocCurveDisplay']}
    - {id: fig-pr, kind: 図, label: PR 曲線, code: ['precision_recall_curve\(', 'PrecisionRecallDisplay']}
    - {id: fig-calibration, kind: 図, label: キャリブレーションプロット, code: ['calibration_curve\(', 'CalibrationDisplay']}
    - {id: fig-binned-residual, kind: 図, label: binned residual plot, code: ['binned', 'bin\w*.{0,20}resid', 'resid\w*.{0,20}bin']}
    - {id: val-se, kind: 値, label: 係数の SE（完全分離の確認）, report: ['完全分離', 'SE.{0,6}(最大|max)', 'SE_max']}
    - {id: val-vif, kind: 値, label: VIF の最大値, report: ['VIF']}
    - {id: val-repeated, kind: 値, label: 反復測定・パネル構造, report: ['反復測定', 'パネル構造', 'cluster.?robust', 'クラスタ.?ロバスト']}
    - {id: val-abs-coef, kind: 値, label: 係数の絶対値, report: ['\|係数\|', '係数の絶対値', 'abs_coef']}
    - {id: val-epv, kind: 値, label: EPV, report: ['EPV']}
    - {id: val-auc-ap, kind: 値, label: AUC・AP, report_all: ['AUC', '\bAP\b|average.precision|平均適合率']}
    - {id: val-brier, kind: 値, label: Brier score, report: ['Brier']}
    - {id: val-binned-out, kind: 値, label: binned residual のバンド外ビン数, report: ['帯外', 'バンド外', 'binned_out']}

# val-pipeline と val-score-vs-baseline は、skill なしでも毎回出たので reference から行を削った。
# 削ったあとも出ているかを見るために、採点表には残している
ml-evaluation: # 分類
  items:
    - {id: fig-learning-curve, kind: 図, label: 過学習を見る曲線（学習曲線）, code: ['learning_curve\(', 'LearningCurveDisplay']}
    - {id: fig-baseline, kind: 図, label: ベースラインとの比較（幅つき）, code_all: ['Dummy(Classifier|Regressor)', 'boxplot\(|violinplot\(|errorbar\(']}
    - {id: fig-confusion, kind: 図, label: 混同行列, code: ['confusion_matrix\(', 'ConfusionMatrixDisplay']}
    - {id: fig-roc-pr, kind: 図, label: PR 曲線・ROC 曲線, code_all: ['roc_curve\(|RocCurveDisplay', 'precision_recall_curve\(|PrecisionRecallDisplay']}
    - {id: val-pipeline, kind: 値, label: 前処理が Pipeline の中にあるか, code: ['Pipeline\(', 'make_pipeline\(']}
    - {id: val-split, kind: 値, label: 分割方法, code: ['stratify\s*=', 'Stratified\w*KFold', 'GroupKFold', 'TimeSeriesSplit']}
    - {id: val-score-vs-baseline, kind: 値, label: 汎化スコアと幅（ベースラインとの比較）, code_all: ['Dummy(Classifier|Regressor)', 'cross_val|KFold|bootstrap|resample']}
    - {id: val-train-val-gap, kind: 値, label: train と validation のスコアの差, report: ['(train|学習(用)?データ|訓練).{0,30}((?<!交)差|ギャップ|gap)', '((?<!交)差|ギャップ).{0,12}train', 'train_val_gap']}
    - {id: val-test-once, kind: 値, label: テストデータでの評価回数, report: ['(テスト|test|ホールドアウト|最終評価|最後の確認|評価用|検証データ).{0,30}(1\s*回|一度)', '(1\s*回|一度)(だけ|のみ).{0,12}(評価|テスト)']}
    - {id: val-tuning-split, kind: 値, label: チューニング時の分割, report: ['チューニング', 'ハイパーパラメータ', 'nested'], allow_negation: true}
    - {id: val-base-rate, kind: 値, label: 陽性率, report: ['陽性率', '生存率.{0,24}\d', 'クラスの偏り']}
    - {id: val-mean-pred, kind: 値, label: 平均予測確率 ÷ 実際の陽性率, report: ['平均予測確率', '予測確率の平均', 'mean_pred']}

clustering: # k-means
  items:
    - {id: fig-silhouette-plot, kind: 図, label: シルエットプロット（サンプル別）, code: ['silhouette_samples\(']}
    - {id: fig-pca, kind: 図, label: PCA 2 次元射影, code: ['PCA\(']}
    - {id: fig-profile, kind: 図, label: クラスタプロファイル, code: ['heatmap\(', 'imshow\(', 'pcolormesh\(']}
    - {id: fig-external, kind: 図, label: 外部変数プロファイル, report: ['外部変数', '(クラスタ|セグメント|分割|分類|分け).{0,24}使(って|わ)(い)?(ません|ない|なかった|ず)', '未使用']}
    - {id: fig-k-scan, kind: 図, label: エルボーとシルエット平均の k 走査, code_all: ['inertia_', 'silhouette_score\(']}
    - {id: fig-null-band, kind: 図, label: 走査図の帰無ベースライン, code: ['permutation\(', 'permuted', 'shuffle\(']}
    - {id: val-scaling, kind: 値, label: スケーリングの方針, report: ['標準化', 'スケーリング', 'log1p', '対数変換']}
    - {id: val-k-rationale, kind: 値, label: 採用した k とその根拠, report: ['k\s*[=＝]\s*\d+.{0,60}(採用|選)', '(採用|選).{0,60}k\s*[=＝]\s*\d+', 'k\s*[=＝]\s*\d+.{0,14}(にした|とした|に決め)', 'k\s*[=＝]\s*\d+.{0,20}(最大|最良|最も高)', 'k の(根拠|決め方|選び方)']}
    - {id: val-null, kind: 値, label: 帰無ベースラインとの比較, report: ['帰無'], code: ['permutation\(']}
    - {id: val-silhouette-mean, kind: 値, label: シルエット平均, report: ['(シルエット|silhouette).{0,24}\d\.\d']}
    - {id: val-cluster-n, kind: 値, label: 各クラスタの n, report: ['人数', '\(?n\s*[=＝]\s*\d+', '最小クラスタ']}
    - {id: val-stability, kind: 値, label: 安定性（ARI）, code: ['adjusted_rand_score\('], report: ['ARI.{0,30}\d\.\d']}
    - {id: val-seed, kind: 値, label: n_init と乱数 seed, report: ['n_init', 'seed\s*[=＝]\s*\d+', '(乱数|シード).{0,12}\d+']}
